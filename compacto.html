<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Elements · Painel Comercial · TV única</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050507; --line:#1E1E26; --line2:#2A2A33;
    --purple:#6F00FF; --lilac:#B47CFF; --lilac2:#C9A7FF;
    --ink:#FFFFFF; --ink2:#C6C6C6; --muted:#8A8A92; --muted2:#5C5C66;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);overflow:hidden;height:100%}
  body{font-family:'Outfit',Helvetica,Arial,sans-serif;color:var(--ink2)}

  /* Canvas fixo 1920x1080 + escala "cover" — mesma regra do painel grande */
  .wall{
    position:fixed; top:50%; left:50%;
    width:1920px; height:1080px;
    transform-origin:50% 50%;
    display:grid;
    grid-template-rows: 25% 41% 34%;
    container-type:size; container-name:wall;
    background:radial-gradient(ellipse 80% 70% at 50% 30%,
      #3A1A80 0%, #170A3D 34%, #0A0512 60%, var(--bg) 84%);
    transition:opacity .35s ease;
  }
  .wall.loading{opacity:0}
  .wall::before{
    content:''; position:absolute; top:0; left:0; width:100%; height:270px;
    background:radial-gradient(ellipse 55% 100% at 50% 0%, rgba(111,0,255,.20), transparent 72%);
    pointer-events:none;
  }

  .eyebrow{
    font-weight:600; text-transform:uppercase; letter-spacing:.22em;
    color:var(--muted); font-size:15px;
  }
  .pct-lab{
    font-weight:400; text-transform:uppercase; letter-spacing:.14em;
    color:var(--muted2); font-size:13px;
  }

  /* ============ FAIXA SUPERIOR ============ */
  .top{
    display:grid; grid-template-columns: 1fr auto 1fr;
    align-items:center; padding:38px 56px 34px;
    position:relative;
  }

  .kpi .num{
    font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:98px; line-height:1; letter-spacing:-.01em; margin-top:8px;
  }
  .kpi .num .cur{ font-size:.44em; color:var(--muted); margin-right:.12em;
    vertical-align:.30em; font-weight:700; }
  .kpi .sub{ font-size:19px; color:var(--muted); margin-top:11px; }
  .kpi .sub b{ color:var(--ink2); font-weight:500; }

  .barline{ display:flex; align-items:center; gap:18px; margin-top:16px; }
  .track{ flex:1; height:12px; background:var(--line2); border-radius:7px; overflow:hidden; }
  .track i{ display:block; height:100%; border-radius:7px;
    background:linear-gradient(90deg,var(--purple),var(--lilac2)); }
  .bigpct{ font-family:'Red Hat Display'; font-weight:800; color:var(--lilac);
    font-size:39px; line-height:1; flex-shrink:0; }

  .brand{ text-align:center; padding:0 60px; }
  .brand .word{ font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:64px; line-height:1; }
  .brand .word .dot{ color:var(--purple); text-shadow:0 0 26px rgba(111,0,255,.95); }
  .brand .slogan{ font-family:'Red Hat Display'; font-style:italic; font-weight:700;
    color:#fff; font-size:27px; margin-top:7px; }

  .proj{ text-align:right; }
  .proj .num{ font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:78px; line-height:1; margin-top:8px; }
  .proj .sub{ font-size:18px; color:var(--muted); margin-top:9px; }
  .proj .sub b{ color:var(--lilac); font-weight:600; }
  .proj .track{ margin-top:14px; height:9px; }

  /* ============ LINHA DE CANAIS ============ */
  .canais{ display:grid; grid-template-columns:repeat(3,1fr); }
  .canal{ padding:28px 44px 24px; display:flex; flex-direction:column;
    min-height:0; position:relative; }

  .canal-top{ display:flex; align-items:baseline; justify-content:space-between;
    gap:16px; flex-shrink:0; }
  .canal-nome{ font-family:'Red Hat Display'; font-weight:700; color:#fff;
    font-size:30px; letter-spacing:.01em; }
  .canal-pct{ font-family:'Red Hat Display'; font-weight:800; color:var(--lilac);
    font-size:35px; line-height:1; }
  .canal-val{ font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:50px; line-height:1; margin-top:9px; flex-shrink:0; }
  .canal-val .cur{ font-size:.42em; color:var(--muted); margin-right:.14em;
    vertical-align:.32em; font-weight:700; }
  .canal-meta{ font-size:16px; color:var(--muted); margin-top:8px; flex-shrink:0;
    display:flex; justify-content:space-between; gap:12px; }
  .canal-meta .proj-inline b{ color:var(--ink2); font-weight:600; }

  .chart{ flex:1; min-height:0; margin-top:14px; }
  .chart svg{ width:100%; height:100%; display:block; }
  .barlabel{ font-family:'Outfit'; font-weight:600; font-size:11px; fill:var(--muted); }
  .barlabel.on{ fill:var(--lilac2); }
  .mlabel{ font-family:'Outfit'; font-weight:500; font-size:10.5px;
    fill:var(--muted2); letter-spacing:.1em; }

  .legend{ display:flex; gap:20px; margin-top:8px; flex-shrink:0;
    font-size:12px; color:var(--muted2); }
  .legend span{ display:flex; align-items:center; gap:7px; }
  .sw{ width:13px; height:8px; border-radius:2px;
    background:linear-gradient(180deg,var(--lilac2),rgba(111,0,255,.4)); }
  .sw.dash{ height:0; border-top:2px dashed var(--muted); background:none; border-radius:0; }

  /* ============ LINHA DE PESSOAS ============ */
  .base{ display:grid; grid-template-columns:repeat(3,1fr); }
  .col{ padding:26px 44px 28px; display:flex; flex-direction:column; min-height:0; }

  .col-head{ display:flex; align-items:baseline; justify-content:space-between;
    gap:14px; flex-shrink:0; margin-bottom:16px; }
  .col-head .t{ font-family:'Red Hat Display'; font-weight:700; color:#fff;
    font-size:23px; }
  .col-head .s{ font-size:14px; color:var(--muted2); text-transform:uppercase;
    letter-spacing:.12em; }

  .lb{ list-style:none; flex:1; min-height:0; display:flex; flex-direction:column;
    gap:13px; overflow:hidden; }
  .lb li{ display:flex; align-items:center; gap:16px; }
  .av{ width:42px; height:42px; border-radius:50%; background:var(--line2);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-weight:600; color:#fff; font-size:15px; letter-spacing:.02em; }
  .lb li.p1 .av{ background:linear-gradient(135deg,var(--purple),var(--lilac2)); }
  .lb-mid{ flex:1; min-width:0; }
  .lb-row{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; }
  .lb-name{ font-weight:400; color:#fff; font-size:22px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb li.p1 .lb-name{ font-weight:600; }
  .lb-val{ font-family:'Outfit'; font-weight:500; color:var(--ink2);
    font-size:19px; flex-shrink:0; }
  .lb-bar{ height:6px; background:var(--line2); border-radius:4px;
    margin-top:7px; overflow:hidden; }
  .lb-bar i{ display:block; height:100%; border-radius:4px; background:var(--muted); }
  .lb li.p1 .lb-bar i{ background:linear-gradient(90deg,var(--purple),var(--lilac2)); }
  .lb li.zero .lb-name, .lb li.zero .lb-val{ color:var(--muted2); }

  /* conversão do site — vem da planilha. Divisor sutil (não é linha de
     emenda de tela, é só agrupamento de conteúdo dentro do próprio bloco) */
  .conv{ flex-shrink:0; margin-top:16px; padding-top:18px;
    border-top:1px solid rgba(255,255,255,.08); display:flex; gap:48px; }
  .conv-item .v{ font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:29px; line-height:1; }
  .conv-item .v.ok{ color:var(--lilac); }
  .conv-item .l{ font-size:13px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.11em; margin-top:7px; }

  .load{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:16px; color:var(--muted); text-transform:uppercase;
    letter-spacing:.18em; z-index:50 }
  .err{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#1a0808; border:1px solid #6b2020; color:#ff9a80;
    padding:24px 32px; border-radius:10px; font-size:15px; max-width:60%;
    z-index:50; display:none; line-height:1.55 }
  .stamp{ position:fixed; bottom:9px; right:14px; font-size:11px;
    color:#3d3d47; z-index:50; letter-spacing:.05em }
</style>
</head>
<body>

<div class="wall loading" id="wall">

  <!-- ===== FAIXA SUPERIOR ===== -->
  <div class="top">
    <div class="kpi">
      <div class="eyebrow" id="t-eyebrow">Total geral</div>
      <div class="num"><span class="cur">R$</span><span id="t-valor">—</span></div>
      <div class="sub">de <b id="t-meta">—</b> de meta no mês</div>
      <div class="barline">
        <div class="track"><i id="t-bar" style="width:0"></i></div>
        <div class="bigpct" id="t-pct">—</div>
      </div>
    </div>

    <div class="brand">
      <div class="word">elements<span class="dot">.</span></div>
      <div class="slogan">viva sem medo</div>
    </div>

    <div class="proj">
      <div class="eyebrow" id="p-eyebrow">Projeção</div>
      <div class="num" id="p-pct">—</div>
      <div class="pct-lab">da meta do mês</div>
      <div class="sub">fecha o mês em <b id="p-valor">—</b></div>
      <div class="track"><i id="p-bar" style="width:0"></i></div>
      <div class="sub" id="p-falta">—</div>
    </div>
  </div>

  <!-- ===== CANAIS ===== -->
  <div class="canais">
    <div class="canal" id="c0"></div>
    <div class="canal" id="c1"></div>
    <div class="canal" id="c2"></div>
  </div>

  <!-- ===== PESSOAS ===== -->
  <div class="base">
    <div class="col" id="b0"></div>
    <div class="col" id="b1"></div>
    <div class="col" id="b2"></div>
  </div>

</div>

<div class="load" id="load">carregando dados</div>
<div class="err" id="err"></div>
<div class="stamp" id="stamp"></div>

<script>
(function(){
  var URL_DADOS = '/.netlify/functions/painel-data';
  var wall = document.getElementById('wall');

  /* Canvas fixo + escala "cover" — nunca contain/letterbox */
  function fit(){
    var s = Math.max(window.innerWidth / 1920, window.innerHeight / 1080);
    wall.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  fit();
  window.addEventListener('resize', fit);

  function miles(v){ return Math.round(v||0).toLocaleString('pt-BR'); }
  function brl(v){ return 'R$ ' + miles(v); }
  function abrev(v){
    v = v || 0;
    if (Math.abs(v) >= 1e6) return 'R$ ' + (v/1e6).toLocaleString('pt-BR',
      {minimumFractionDigits:1,maximumFractionDigits:1}) + 'M';
    if (Math.abs(v) >= 1e3) return 'R$ ' + Math.round(v/1e3) + 'k';
    return brl(v);
  }
  function p1(v){ return (v||0).toLocaleString('pt-BR',
    {minimumFractionDigits:1,maximumFractionDigits:1}) + '%'; }
  function p0(v){ return Math.round(v||0) + '%'; }
  function p2(v){ return (v||0).toLocaleString('pt-BR',
    {minimumFractionDigits:2,maximumFractionDigits:2}) + '%'; }
  function cap(v){ return Math.max(0, Math.min(100, v||0)); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function inic(n){
    var p = String(n||'').trim().split(/\s+/);
    return (p.length>=2 ? (p[0][0]+p[1][0]) : String(n||'').slice(0,2)).toUpperCase();
  }
  function set(id, v){ var e=document.getElementById(id); if(e) e.textContent=v; }
  function bar(id, pct){ var e=document.getElementById(id); if(e) e.style.width=cap(pct)+'%'; }

  /* Gráfico de evolução — mesma lógica do painel grande:
     altura da barra usa o VALOR absoluto; o % é só rótulo em cima. */
  function chart(hist, gid){
    if (!hist || !hist.length) return '';
    var W=440, H=132, BASE=112, UTIL=90, n=hist.length;
    var pad=8, span=(W-pad*2)/n, bw=span*0.52;
    var mx=0;
    hist.forEach(function(d){ mx=Math.max(mx, d.atingido||0, d.meta||0); });
    if (!mx) return '';

    var bars='', pts=[], labels='';
    hist.forEach(function(d,i){
      var h=(d.atingido||0)*UTIL/mx;
      var x=pad + i*span + (span-bw)/2;
      var y=BASE-h, cx=x+bw/2;
      var my=BASE-(d.meta||0)*UTIL/mx;
      var pc=d.meta ? (d.atingido/d.meta)*100 : 0;
      var last=(i===n-1);
      bars+='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+
            '" height="'+h.toFixed(1)+'" rx="3" fill="url(#'+gid+')"'+
            (last?'':' opacity=".62"')+'/>';
      pts.push(cx.toFixed(1)+','+my.toFixed(1));
      labels+='<text x="'+cx.toFixed(1)+'" y="'+(y-6).toFixed(1)+
              '" text-anchor="middle" class="barlabel'+(last?' on':'')+'">'+p0(pc)+'</text>';
    });
    var u=pts[pts.length-1].split(',');
    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">'+
      '<defs><linearGradient id="'+gid+'" x1="0" y1="0" x2="0" y2="1">'+
        '<stop offset="0%" stop-color="#C9A7FF" stop-opacity=".95"/>'+
        '<stop offset="100%" stop-color="#6F00FF" stop-opacity=".32"/>'+
      '</linearGradient></defs>'+ bars +
      '<path d="M'+pts.join(' L')+'" fill="none" stroke="#8A8A92" stroke-width="1.7" '+
        'stroke-dasharray="1 5" stroke-linecap="round"/>'+
      '<circle cx="'+u[0]+'" cy="'+u[1]+'" r="4" fill="none" stroke="#C6C6C6" stroke-width="1.5"/>'+
      labels +
      '<text x="'+pad+'" y="'+(H-2)+'" class="mlabel">'+esc((hist[0].mes||'').toUpperCase())+'</text>'+
      '<text x="'+(W-pad)+'" y="'+(H-2)+'" text-anchor="end" class="mlabel">'+
        esc((hist[n-1].mes||'').toUpperCase())+'</text>'+
    '</svg>';
  }

  function lista(itens){
    if (!itens || !itens.length) return '<ul class="lb"></ul>';
    var topo=0;
    itens.forEach(function(p){ topo=Math.max(topo, p.valor||0); });
    var h='<ul class="lb">';
    itens.forEach(function(p,i){
      var cls=(i===0 && (p.valor||0)>0)?'p1':'';
      if(!(p.valor>0)) cls+=' zero';
      var w=topo?cap((p.valor||0)/topo*100):0;
      h+='<li class="'+cls+'">'+
        '<div class="av">'+esc(inic(p.nome))+'</div>'+
        '<div class="lb-mid">'+
          '<div class="lb-row"><span class="lb-name">'+esc(p.nome)+'</span>'+
          '<span class="lb-val">'+brl(p.valor)+'</span></div>'+
          '<div class="lb-bar"><i style="width:'+w.toFixed(1)+'%"></i></div>'+
        '</div></li>';
    });
    return h+'</ul>';
  }

  function render(d){
    var mes = d.mes_vigente || '';
    var h = d.hero || {};

    set('t-eyebrow','Total geral · '+mes);
    set('t-valor', miles(h.valor));
    set('t-meta', brl(h.meta));
    set('t-pct', p1(h.pct_atingido));
    bar('t-bar', h.pct_atingido);

    set('p-eyebrow','Projeção · '+mes);
    set('p-pct', p0(h.projecao_pct));
    set('p-valor', brl(h.projecao));
    bar('p-bar', h.projecao_pct);
    var falta=(h.meta||0)-(h.valor||0);
    set('p-falta', falta>0 ? 'faltam '+brl(falta)+' para a meta' : 'meta do mês batida');

    var canais = d.canais || [];
    canais.forEach(function(c,i){
      var el=document.getElementById('c'+i);
      if(!el) return;
      el.innerHTML=
        '<div class="canal-top"><span class="canal-nome">'+esc(c.nome)+'</span>'+
          '<span class="canal-pct">'+p1(c.pct_meta)+'</span></div>'+
        '<div class="canal-val"><span class="cur">R$</span>'+miles(c.realizado)+'</div>'+
        '<div class="canal-meta"><span>de '+abrev(c.meta)+' de meta</span>'+
          '<span class="proj-inline">projetado <b>'+p0(c.projecao_pct)+'</b></span></div>'+
        '<div class="chart">'+chart(c.historico,'g'+i)+'</div>'+
        '<div class="legend"><span><i class="sw"></i>Realizado</span>'+
          '<span><i class="sw dash"></i>Meta</span></div>';
    });

    /* Base: vendedores dos 3 canais. No Digital a planilha traz a
       composição do canal (B2C IN/OUT e TVAs), não pessoas. */
    var rotulos = ['Vendedores','Vendedores','Composição do canal'];
    canais.forEach(function(c,i){
      var el=document.getElementById('b'+i);
      if(!el) return;
      var extra='';
      if(i===2 && d.conversao && d.conversao.b2c){
        var cv=d.conversao.b2c;
        var ok=(cv.atual||0)>=(cv.meta||0);
        extra='<div class="conv">'+
          '<div class="conv-item"><div class="v'+(ok?' ok':'')+'">'+p2(cv.atual)+'</div>'+
            '<div class="l">conversão do site</div></div>'+
          '<div class="conv-item"><div class="v">'+p2(cv.meta)+'</div>'+
            '<div class="l">meta de conversão</div></div>'+
        '</div>';
      }
      el.innerHTML=
        '<div class="col-head"><span class="t">'+esc(rotulos[i])+'</span>'+
          '<span class="s">'+esc(c.nome)+'</span></div>'+
        lista(c.vendedores) + extra;
    });

    set('stamp', 'planilha GERAL 2026 · '+
      (d.atualizado_em ? new Date(d.atualizado_em).toLocaleTimeString('pt-BR') : '—'));
    document.getElementById('load').style.display='none';
    document.getElementById('err').style.display='none';
    wall.classList.remove('loading');
  }

  function falhar(msg){
    document.getElementById('load').style.display='none';
    var e=document.getElementById('err');
    e.innerHTML='<b>Não foi possível carregar os dados</b><br>'+esc(msg)+
      '<br><br>O painel não exibe números antigos por segurança.';
    e.style.display='block';
  }

  function carregar(){
    fetch(URL_DADOS + '?_=' + Date.now(), { cache:'no-store' })
      .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(d){ if(d.error) throw new Error(d.detail||d.error); render(d); })
      .catch(function(e){ falhar(e.message); });
  }

  carregar();
  setInterval(carregar, 60*1000);

  /* Rede de segurança: recarrega a cada 5 min com cache-busting */
  setTimeout(function(){
    location.replace(location.pathname + '?_r=' + Date.now());
  }, 6 * 60 * 60 * 1000);
})();
</script>
</body>
</html>
