<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Elements · Painel Comercial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050507; --line:#1E1E26; --line2:#2A2A33;
    --purple:#6F00FF; --lilac:#B47CFF;
    --ink:#FFFFFF; --ink2:#C6C6C6; --muted:#8A8A92; --muted2:#5C5C66;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);overflow:hidden;height:100%}
  body{font-family:'Outfit',Helvetica,Arial,sans-serif;color:var(--ink2)}

  /* ===== Canvas fixo 1920x1080 + escala "cover" ===== */
  .wall{
    position:fixed; top:50%; left:50%;
    width:1920px; height:1080px;
    transform-origin:50% 50%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(4,1fr);
    container-type:size; container-name:wall;
    background:radial-gradient(ellipse 75% 68% at 50% 42%,
      #3A1A80 0%, #170A3D 32%, #0A0512 58%, var(--bg) 82%);
  }
  .wall::before{
    content:''; position:absolute; top:0; left:0; width:100%; height:270px;
    background:radial-gradient(ellipse 60% 100% at 50% 0%, rgba(111,0,255,.17), transparent 70%);
    pointer-events:none; z-index:0;
  }

  .cell{
    container-type:size; container-name:tv;
    display:flex; flex-direction:column;
    padding:5.6cqh 3.2cqw;
    position:relative; overflow:hidden; z-index:1;
  }
  .cell.br{ border-right:3px solid var(--line); }
  .cell.bb{ border-bottom:3px solid var(--line); }

  /* ===== Tipografia base ===== */
  .eyebrow{
    font-weight:600; text-transform:uppercase; letter-spacing:.2em;
    color:var(--muted); font-size:clamp(9.3px, 3.641cqh, 23.7px);
    flex-shrink:0; margin-bottom:.7em;
  }
  .pct-lab{ font-weight:400; color:var(--muted2); letter-spacing:.12em;
    text-transform:uppercase; font-size:clamp(7.5px, 2.7cqh, 15px); margin-top:.25em; }
  .src{ font-size:clamp(7px, 2.2cqh, 12px); color:var(--muted2);
    text-transform:uppercase; letter-spacing:.1em; }

  /* ===== Hero ===== */
  .hero-body{ flex:1; display:flex; flex-direction:column; justify-content:center; min-height:0; }
  .hero-num{
    font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:clamp(25.2px, 12.241cqh, 101.2px); line-height:1;
  }
  .hero-sub{ font-size:clamp(8.5px, 3.1cqh, 19px); color:var(--muted); margin-top:.6em; }
  .bar-track{ height:clamp(4px,2.2cqh,10px); background:var(--line2); border-radius:6px;
    margin-top:1em; overflow:hidden; flex-shrink:0; }
  .bar-fill{ height:100%; background:linear-gradient(90deg,var(--purple),var(--lilac));
    border-radius:6px; }
  .hero-pct{ font-family:'Red Hat Display'; font-weight:800; color:var(--lilac);
    font-size:clamp(11px, 4.2cqh, 26px); margin-top:.55em; }

  /* ===== Marca ===== */
  .id-cell{ align-items:center; justify-content:center; text-align:center; }
  .id-cell .word{
    font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:clamp(47.5px, 27.15cqh, 112.5px); line-height:1;
  }
  .id-cell .word .dot{ color:var(--purple); text-shadow:0 0 26px rgba(111,0,255,.95); }
  .id-cell .slogan{
    font-family:'Red Hat Display'; font-style:italic; font-weight:700; color:#fff;
    font-size:clamp(22.5px, 12.06cqh, 50.5px); margin-top:.35em;
  }

  /* ===== Canal (evolução) ===== */
  .canal-head{ flex-shrink:0; }
  .canal-head h3{
    font-family:'Red Hat Display'; font-weight:700; color:#fff;
    font-size:clamp(12.1px, 4.341cqh, 28.4px); line-height:1.1;
  }
  .canal-val{ font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:clamp(17px, 7.4cqh, 54px); line-height:1; margin-top:.15em; }
  .canal-meta{ font-size:clamp(7.5px,2.8cqh,16px); color:var(--muted); margin-top:.25em; }
  .canal-pct{ font-family:'Red Hat Display'; font-weight:800; color:var(--lilac);
    font-size:clamp(13px,4.7cqh,30px); margin-top:.45em; }
  .chart{ flex:1; min-height:0; margin-top:.7em; }
  .chart svg{ width:100%; height:100%; display:block; }

  /* ===== Listas (ranking / itens) ===== */
  .list-head{ display:flex; justify-content:space-between; align-items:flex-start;
    flex-shrink:0; gap:.5em; }
  .list-head h3{ font-family:'Red Hat Display'; font-weight:700; color:#fff;
    font-size:clamp(11.5px, 4.1cqh, 26px); line-height:1.1; }
  .head-stat{ text-align:right; flex-shrink:0; }
  .head-stat .n{ font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:clamp(11px, 4cqh, 25px); line-height:1; }
  .head-stat .l{ font-size:clamp(6.5px,2.2cqh,12px); color:var(--muted);
    text-transform:uppercase; letter-spacing:.12em; margin-top:.2em; }

  .lb{ list-style:none; margin-top:.85em; flex:1; min-height:0;
    display:flex; flex-direction:column; gap:.5em; overflow:hidden; flex-shrink:1; }
  .lb li{ display:flex; align-items:center; gap:.55em; }
  .avatar{
    width:clamp(15px, 5cqh, 32px); height:clamp(15px, 5cqh, 32px);
    border-radius:50%; background:var(--line2); flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    font-weight:600; color:#fff; font-size:clamp(6.5px,2.3cqh,13px);
  }
  .lb li.top .avatar{ background:linear-gradient(135deg,var(--purple),var(--lilac)); }
  .lb-txt{ flex:1; min-width:0; }
  .lb-name{ font-weight:400; color:#fff; font-size:clamp(10.6px, 3.741cqh, 24.5px);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb li.top .lb-name{ font-weight:600; }
  .lb-bar{ height:clamp(2px,1.1cqh,5px); background:var(--line2); border-radius:3px;
    margin-top:.28em; overflow:hidden; }
  .lb-bar i{ display:block; height:100%; background:var(--muted); border-radius:3px; }
  .lb li.top .lb-bar i{ background:linear-gradient(90deg,var(--purple),var(--lilac)); }
  .lb-val{ font-weight:500; color:var(--ink2); font-size:clamp(8.5px,3cqh,19px);
    flex-shrink:0; }
  .lb li.zero .lb-name, .lb li.zero .lb-val{ color:var(--muted2); }

  /* ===== Bloco de estatística fixa (nunca corta) ===== */
  .stats{ flex-shrink:0; margin-top:.7em; display:flex; gap:4cqw; }
  .stat .v{ font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:clamp(13px,5cqh,30px); line-height:1; }
  .stat .v.lilac{ color:var(--lilac); }
  .stat .l{ font-size:clamp(6.5px,2.3cqh,12.5px); color:var(--muted);
    text-transform:uppercase; letter-spacing:.11em; margin-top:.28em; }

  /* ===== Ritmo do mês (dias úteis) ===== */
  .rhythm{ flex:1; min-height:0; display:flex; flex-direction:column;
    justify-content:center; gap:3.4cqh; }
  .rh-row .rh-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .rh-lab{ font-weight:600; color:#fff; font-size:clamp(9.5px,3.3cqh,21px); }
  .rh-days{ font-size:clamp(8px,2.8cqh,16px); color:var(--muted); }
  .rh-track{ height:clamp(4px,2cqh,9px); background:var(--line2); border-radius:6px;
    margin-top:.45em; overflow:hidden; position:relative; }
  .rh-fill{ height:100%; border-radius:6px; }
  .rh-fill.time{ background:var(--muted); }
  .rh-fill.sales{ background:linear-gradient(90deg,var(--purple),var(--lilac)); }
  .rh-note{ font-size:clamp(7px,2.5cqh,13.5px); color:var(--muted2); margin-top:.35em; }

  /* ===== Conversão (meta vs atual) ===== */
  .conv{ flex:1; min-height:0; display:flex; flex-direction:column;
    justify-content:center; gap:4cqh; }
  .conv-row .conv-top{ display:flex; justify-content:space-between; align-items:baseline; }
  .conv-name{ font-weight:600; color:#fff; font-size:clamp(9.5px,3.3cqh,21px); }
  .conv-val{ font-family:'Red Hat Display'; font-weight:800;
    font-size:clamp(14px,5.4cqh,34px); line-height:1; }
  .conv-val.ok{ color:var(--lilac); }
  .conv-val.low{ color:#fff; }
  .conv-meta{ font-size:clamp(7px,2.5cqh,13.5px); color:var(--muted); margin-top:.3em; }
  .conv-track{ height:clamp(3px,1.5cqh,7px); background:var(--line2); border-radius:5px;
    margin-top:.45em; overflow:hidden; }
  .conv-track i{ display:block; height:100%; border-radius:5px;
    background:linear-gradient(90deg,var(--purple),var(--lilac)); }

  .mock-badge{ position:absolute; top:6px; left:50%; transform:translateX(-50%);
    background:rgba(255,90,60,.16); border:1px solid rgba(255,120,90,.55); color:#FF8A6B;
    font-weight:600; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    padding:4px 16px; border-radius:20px; z-index:20; display:none; }
  .stale{ position:fixed; bottom:8px; right:12px; font:10px/1 monospace;
    color:#4a4a55; opacity:.5; z-index:20; }
  .err{ position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    background:#1a0808; border:1px solid #6b2020; color:#ff9a80; padding:20px 28px;
    border-radius:10px; font-size:14px; max-width:70%; z-index:30; display:none; }
</style>
</head>
<body>

<div class="wall" id="wall">
  <div class="mock-badge" id="mockBadge">dados de exemplo — não ao vivo</div>

  <!-- ===== LINHA 1: hero · marca · projeção ===== -->
  <div class="cell br bb">
    <div class="eyebrow" id="h1-eyebrow">Total geral</div>
    <div class="hero-body">
      <div class="hero-num" id="h1-valor">—</div>
      <div class="hero-sub" id="h1-meta">—</div>
      <div class="bar-track"><div class="bar-fill" id="h1-bar" style="width:0"></div></div>
      <div class="hero-pct" id="h1-pct">—</div>
      <div class="pct-lab">da meta do mês</div>
    </div>
  </div>

  <div class="cell br bb id-cell">
    <div class="word">elements<span class="dot">.</span></div>
    <div class="slogan">viva sem medo</div>
  </div>

  <div class="cell bb">
    <div class="eyebrow">Projeção de fechamento</div>
    <div class="hero-body">
      <div class="hero-num" id="h2-pct">—</div>
      <div class="pct-lab">da meta do mês</div>
      <div class="hero-sub" id="h2-valor">—</div>
      <div class="bar-track"><div class="bar-fill" id="h2-bar" style="width:0"></div></div>
      <div class="hero-sub" id="h2-falta">—</div>
    </div>
  </div>

  <!-- ===== LINHA 2: evolução por canal ===== -->
  <div class="cell br bb" id="canal-0"></div>
  <div class="cell br bb" id="canal-1"></div>
  <div class="cell bb" id="canal-2"></div>

  <!-- ===== LINHA 3: rankings ===== -->
  <div class="cell br bb" id="rk-revenda"></div>
  <div class="cell br bb" id="rk-corporativo"></div>
  <div class="cell bb" id="rk-sdrs"></div>

  <!-- ===== LINHA 4: ritmo · digital detalhado · conversão ===== -->
  <div class="cell br" id="cell-ritmo"></div>
  <div class="cell br" id="cell-digital"></div>
  <div class="cell" id="cell-conversao"></div>
</div>

<div class="stale" id="stale"></div>
<div class="err" id="err"></div>

<script>
(function(){
  var wall = document.getElementById('wall');

  /* Canvas fixo + escala "cover" — nunca contain/letterbox */
  function fit(){
    var s = Math.max(window.innerWidth / 1920, window.innerHeight / 1080);
    wall.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  fit();
  window.addEventListener('resize', fit);

  var fBRL  = new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
  var fNum  = new Intl.NumberFormat('pt-BR');

  function p1(n){ return (n||0).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}); }
  function p2(n){ return (n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function clampPct(n){ return Math.max(0, Math.min(100, n||0)); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function inic(nome){
    var partes = String(nome).trim().split(/\s+/);
    if (partes.length >= 2) return (partes[0][0] + partes[1][0]).toUpperCase();
    return String(nome).slice(0,2).toUpperCase();
  }
  function abrevBRL(v){
    v = v || 0;
    if (Math.abs(v) >= 1e6) return 'R$ ' + p1(v/1e6) + 'M';
    if (Math.abs(v) >= 1e3) return 'R$ ' + Math.round(v/1e3) + 'k';
    return fBRL.format(v);
  }

  /* ---- Gráfico de barras + linha de meta pontilhada ---- */
  function svgChart(hist){
    if (!hist || !hist.length) return '';
    var W = 100, H = 100, n = hist.length;
    var maxV = 0;
    hist.forEach(function(d){ maxV = Math.max(maxV, d.atingido||0, d.meta||0); });
    if (!maxV) return '';
    var stepX = W / n, bars = '', metaPath = '', labels = '';

    hist.forEach(function(d, i){
      var bh = ((d.atingido||0) / maxV) * (H - 14);
      var x  = i * stepX + stepX * 0.18;
      var w  = stepX * 0.64;
      var y  = H - bh;
      var ultimo = (i === n - 1);
      bars += '<rect x="'+x.toFixed(2)+'" y="'+y.toFixed(2)+'" width="'+w.toFixed(2)+
              '" height="'+bh.toFixed(2)+'" rx="0.8" fill="'+(ultimo?'#B47CFF':'#4a3a6b')+'"/>';
      var mx = i * stepX + stepX / 2;
      var my = H - ((d.meta||0) / maxV) * (H - 14);
      metaPath += (i === 0 ? 'M ' : ' L ') + mx.toFixed(2) + ' ' + my.toFixed(2);
      labels += '<text x="'+mx.toFixed(2)+'" y="'+(H-1.5)+'" font-size="6.5" fill="'+
                (ultimo?'#B47CFF':'#5C5C66')+'" text-anchor="middle" font-family="Outfit">'+
                esc(d.mes)+'</text>';
    });

    return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none">' + bars +
      '<path d="'+metaPath+'" fill="none" stroke="#8A8A92" stroke-width="0.9" ' +
      'stroke-dasharray="2.2,2" vector-effect="non-scaling-stroke"/>' + labels + '</svg>';
  }

  /* ---- Lista de pessoas com barra relativa ao 1º ---- */
  function listaHTML(itens, opts){
    opts = opts || {};
    if (!itens || !itens.length) return '<ul class="lb"></ul>';
    var topo = Math.max.apply(null, itens.map(function(p){ return p.valor||0; })) || 1;
    var html = '<ul class="lb">';
    itens.forEach(function(p, i){
      var cls = (i === 0 && (p.valor||0) > 0) ? 'top' : '';
      if (!(p.valor > 0)) cls += ' zero';
      var largura = clampPct(((p.valor||0) / topo) * 100);
      html += '<li class="'+cls+'">' +
        '<div class="avatar">'+esc(inic(p.nome))+'</div>' +
        '<div class="lb-txt">' +
          '<div class="lb-name">'+esc(p.nome)+'</div>' +
          '<div class="lb-bar"><i style="width:'+largura.toFixed(1)+'%"></i></div>' +
        '</div>' +
        '<div class="lb-val">'+abrevBRL(p.valor)+'</div>' +
      '</li>';
    });
    return html + '</ul>';
  }

  /* ---- Render de um quadrante de canal ---- */
  function renderCanal(el, c){
    if (!el || !c) return;
    el.innerHTML =
      '<div class="canal-head">' +
        '<h3>'+esc(c.nome)+'</h3>' +
        '<div class="canal-val">'+fBRL.format(c.realizado)+'</div>' +
        '<div class="canal-meta">de '+abrevBRL(c.meta)+' de meta</div>' +
        '<div class="canal-pct">'+p1(c.pct_meta)+'%</div>' +
        '<div class="pct-lab">da meta do mês</div>' +
      '</div>' +
      '<div class="chart">'+svgChart(c.historico)+'</div>';
  }

  /* ---- Render principal ---- */
  function render(d){
    // Linha 1 · hero
    document.getElementById('h1-eyebrow').textContent = d.hero.titulo;
    document.getElementById('h1-valor').textContent = fBRL.format(d.hero.valor);
    document.getElementById('h1-meta').textContent = 'de ' + fBRL.format(d.hero.meta) + ' de meta';
    document.getElementById('h1-bar').style.width = clampPct(d.hero.pct_atingido) + '%';
    document.getElementById('h1-pct').textContent = p1(d.hero.pct_atingido) + '%';

    // Linha 1 · projeção
    document.getElementById('h2-pct').textContent = p1(d.hero.projecao_pct) + '%';
    document.getElementById('h2-valor').textContent = 'fecha o mês em ' + fBRL.format(d.hero.projecao);
    document.getElementById('h2-bar').style.width = clampPct(d.hero.projecao_pct) + '%';
    var falta = (d.hero.meta || 0) - (d.hero.valor || 0);
    document.getElementById('h2-falta').textContent =
      falta > 0 ? 'faltam ' + fBRL.format(falta) + ' para a meta' : 'meta do mês batida';

    // Linha 2 · canais
    (d.canais || []).forEach(function(c, i){
      renderCanal(document.getElementById('canal-' + i), c);
    });

    // Linha 3 · rankings
    var rk = d.rankings || {};
    function bloco(elId, titulo, itens, stat){
      var el = document.getElementById(elId);
      if (!el) return;
      el.innerHTML =
        '<div class="list-head">' +
          '<h3>'+esc(titulo)+'</h3>' +
          (stat ? '<div class="head-stat"><div class="n">'+stat.n+'</div>' +
                  '<div class="l">'+esc(stat.l)+'</div></div>' : '') +
        '</div>' + listaHTML(itens);
    }

    bloco('rk-revenda', 'Revenda · vendedores', rk.revenda,
      { n: p1(pctCanal(d,'Revenda')) + '%', l: 'da meta' });
    bloco('rk-corporativo', 'Corporativo · vendedores', rk.corporativo,
      { n: p1(pctCanal(d,'Corporativo')) + '%', l: 'da meta' });
    bloco('rk-sdrs', 'Participação SDRs', rk.sdrs,
      rk.sdr_geral ? { n: p1(rk.sdr_geral.pct) + '%', l: 'meta do time' } : null);

    // Linha 4 · ritmo do mês
    var dias = d.dias || {};
    var elR = document.getElementById('cell-ritmo');
    function rhRow(lab, obj, vendaPct){
      if (!obj) return '';
      return '<div class="rh-row">' +
        '<div class="rh-top"><span class="rh-lab">'+esc(lab)+'</span>' +
        '<span class="rh-days">'+obj.trabalhados+' de '+obj.total+' dias</span></div>' +
        '<div class="rh-track"><div class="rh-fill time" style="width:'+
          clampPct(obj.pct_decorrido).toFixed(1)+'%"></div></div>' +
        '<div class="rh-note">'+p1(obj.pct_decorrido)+'% do prazo · '+
          p1(vendaPct)+'% da meta vendida</div>' +
      '</div>';
    }
    elR.innerHTML =
      '<div class="eyebrow">Ritmo do mês</div>' +
      '<div class="rhythm">' +
        rhRow('B2B · Revenda e Corporativo', dias.b2b, pctB2B(d)) +
        rhRow('B2C · Digital', dias.b2c, pctCanal(d,'Digital')) +
      '</div>' +
      '<div class="stats"><div class="stat">' +
        '<div class="v">'+(dias.b2b ? dias.b2b.faltantes : '—')+'</div>' +
        '<div class="l">dias úteis restantes</div></div></div>';

    // Linha 4 · digital detalhado
    var elD = document.getElementById('cell-digital');
    var dig = d.digital_detalhe || [];
    var canalDig = (d.canais || []).filter(function(c){
      return c.nome.toLowerCase().indexOf('digital') >= 0; })[0];
    elD.innerHTML =
      '<div class="list-head"><h3>Digital · composição</h3>' +
        (canalDig ? '<div class="head-stat"><div class="n">'+abrevBRL(canalDig.realizado)+
          '</div><div class="l">total do canal</div></div>' : '') +
      '</div>' + listaHTML(dig);

    // Linha 4 · conversão do site
    var cv = d.conversao || {};
    var elC = document.getElementById('cell-conversao');
    function convRow(nome, o){
      if (!o) return '';
      var atingiu = (o.atual || 0) >= (o.meta || 0);
      var rel = o.meta ? clampPct((o.atual / o.meta) * 100) : 0;
      return '<div class="conv-row">' +
        '<div class="conv-top"><span class="conv-name">'+esc(nome)+'</span>' +
        '<span class="conv-val '+(atingiu?'ok':'low')+'">'+p2(o.atual)+'%</span></div>' +
        '<div class="conv-track"><i style="width:'+rel.toFixed(1)+'%"></i></div>' +
        '<div class="conv-meta">meta '+p2(o.meta)+'% · '+p1(rel)+'% da meta de conversão</div>' +
      '</div>';
    }
    elC.innerHTML =
      '<div class="list-head"><h3>Conversão do site</h3>' +
        '<div class="head-stat"><div class="l">'+esc(d.mes_vigente || '')+'</div></div></div>' +
      '<div class="conv">' +
        convRow('B2C · site', cv.b2c) +
        convRow('Corporativo · site', cv.corp) +
      '</div>' +
      '<div class="stats"><div class="stat"><div class="v lilac">'+
        (cv.cac_corp_meta ? p1(cv.cac_corp_meta)+'%' : '—') +
        '</div><div class="l">meta CAC corporativo</div></div></div>';

    // Avisos
    document.getElementById('mockBadge').style.display = d.__aviso ? 'block' : 'none';
    document.getElementById('stale').textContent =
      (d.fonte || '') + ' · ' + new Date(d.atualizado_em).toLocaleTimeString('pt-BR');
    document.getElementById('err').style.display = 'none';
  }

  /* Helpers que dependem do payload */
  function pctCanal(d, nome){
    var c = (d.canais || []).filter(function(x){
      return x.nome.toLowerCase().indexOf(nome.toLowerCase()) >= 0; })[0];
    return c ? c.pct_meta : 0;
  }
  function pctB2B(d){
    var soma = 0, meta = 0;
    (d.canais || []).forEach(function(c){
      var n = c.nome.toLowerCase();
      if (n.indexOf('revenda') >= 0 || n.indexOf('corporativ') >= 0){
        soma += c.realizado || 0; meta += c.meta || 0;
      }
    });
    return meta ? (soma / meta) * 100 : 0;
  }

  function mostrarErro(msg){
    var e = document.getElementById('err');
    e.textContent = 'Não foi possível carregar os dados: ' + msg;
    e.style.display = 'block';
  }

  function loadData(){
    fetch('/.netlify/functions/painel-data', { cache: 'no-store' })
      .then(function(r){
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(d){
        if (d.error) throw new Error(d.detail || d.error);
        render(d);
      })
      .catch(function(err){ mostrarErro(err.message); });
  }

  loadData();
  setInterval(loadData, 60 * 1000);

  /* Rede de segurança: recarrega a página a cada 5 min com cache-busting,
     garante que a TV pegue novos deploys de design */
  setTimeout(function(){
    window.location.href = window.location.pathname + '?_r=' + Date.now();
  }, 5 * 60 * 1000);
})();
</script>
</body>
</html>
