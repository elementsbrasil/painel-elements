<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 3 meta tags de no-cache, exigidas pela spec de hardware -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Elements · Painel Comercial (live)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@700;800&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#050507; --line:#1E1E26; --line2:#2A2A33;
    --purple:#6F00FF; --lilac:#B47CFF;
    --ink:#FFFFFF; --ink2:#C6C6C6; --muted:#8A8A92; --muted2:#5C5C66;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);overflow:hidden;height:100%}
  body{font-family:'Outfit',Helvetica,Arial,sans-serif;color:var(--ink2)}

  /* ===== Canvas fixo 1920x1080 + escala "cover" (NUNCA vw/vh, NUNCA contain) ===== */
  .wall{
    position:fixed; top:50%; left:50%;
    width:1920px; height:1080px;
    transform-origin:50% 50%;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    grid-template-rows:repeat(4,1fr);
    container-type:size; container-name:wall;
    background:radial-gradient(ellipse 75% 68% at 50% 42%,
      #3A1A80 0%, #170A3D 32%, #0A0512 58%, var(--bg) 82%);
  }
  .wall::before{
    content:''; position:absolute; top:0; left:0; width:100%; height:270px;
    background:radial-gradient(ellipse 60% 100% at 50% 0%, rgba(111,0,255,.17), transparent 70%);
    pointer-events:none;
  }

  .cell{
    container-type:size; container-name:tv;
    display:flex; flex-direction:column;
    padding:5.6cqh 3.2cqw;
    position:relative; overflow:hidden;
  }
  .cell.br{ border-right:3px solid var(--line); }
  .cell.bb{ border-bottom:3px solid var(--line); }

  .eyebrow{
    font-family:'Outfit'; font-weight:600; text-transform:uppercase; letter-spacing:.2em;
    color:var(--muted); font-size:clamp(9.3px, 3.641cqh, 23.7px);
    margin-bottom:.6em;
  }
  .pct-lab{ font-family:'Outfit'; font-weight:400; color:var(--muted2);
    font-size:clamp(8px, 3cqh, 18px); margin-top:.3em; }

  /* ===== Componente: Marca (fixa, coluna central linha 1) ===== */
  .id-cell{ align-items:center; justify-content:center; text-align:center; }
  .id-cell .word{
    font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:clamp(47.5px, 27.15cqh, 112.5px); line-height:1;
  }
  .id-cell .word .dot{ color:var(--purple); text-shadow:0 0 24px rgba(111,0,255,.9); }
  .id-cell .slogan{
    font-family:'Red Hat Display'; font-style:italic; font-weight:700; color:#fff;
    font-size:clamp(22.5px, 12.06cqh, 50.5px); margin-top:.4em;
  }

  /* ===== Componente: Hero (KPI manchete) ===== */
  .hero-num{ flex:1; display:flex; flex-direction:column; justify-content:center; }
  .hero-num .big{
    font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:clamp(25.2px, 12.241cqh, 101.2px); line-height:1;
  }
  .hero-num .sub{ font-size:clamp(9px, 3.2cqh, 20px); color:var(--muted); margin-top:.5em; }
  .bar-track{ height:6px; background:var(--line2); border-radius:4px; margin-top:.9em; overflow:hidden; }
  .bar-fill{ height:100%; background:linear-gradient(90deg,var(--purple),var(--lilac)); border-radius:4px; }
  .bar-pct{ font-family:'Red Hat Display'; font-weight:800; color:var(--lilac);
    font-size:clamp(10px, 3.6cqh, 22px); margin-top:.5em; }

  /* ===== Componente: Evolução (meta x realizado por canal) ===== */
  .canal-stat h3{
    font-family:'Red Hat Display'; font-weight:700; color:#fff;
    font-size:clamp(12.1px, 4.341cqh, 28.4px); margin-bottom:.3em;
  }
  .canal-stat .val{ font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:clamp(18px, 8cqh, 60px); line-height:1; }
  .canal-stat .meta-txt{ font-size:clamp(8px,3cqh,17px); color:var(--muted); margin-top:.2em; }
  .canal-stat .pct-big{ font-family:'Red Hat Display'; font-weight:800; color:var(--lilac);
    font-size:clamp(14px,5cqh,32px); margin-top:.4em; }
  .chart{ flex:1; min-height:0; margin-top:.6em; }
  .chart svg{ width:100%; height:100%; display:block; }

  /* ===== Componente: Ranking / Leaderboard ===== */
  .rank-head{ display:flex; justify-content:space-between; align-items:flex-start; flex-shrink:0; }
  .rank-head h3{ font-family:'Red Hat Display'; font-weight:700; color:#fff;
    font-size:clamp(12px, 4.2cqh, 26px); }
  .cli-mini{ text-align:right; flex-shrink:0; }
  .cli-mini .num{ font-family:'Red Hat Display'; font-weight:800; color:#fff;
    font-size:clamp(12px, 4.6cqh, 28px); }
  .cli-mini .lab{ font-size:clamp(7px,2.4cqh,13px); color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
  .lb{ list-style:none; margin-top:.8em; flex:1; min-height:0; display:flex; flex-direction:column; gap:.55em;
    overflow:hidden; }
  .lb li{ display:flex; align-items:center; gap:.6em; }
  .lb .avatar{ width:clamp(16px, 5.2cqh, 34px); height:clamp(16px, 5.2cqh, 34px); border-radius:50%;
    background:var(--line2); flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-family:'Outfit'; font-weight:600; color:#fff; font-size:clamp(7px,2.4cqh,14px); }
  .lb li:first-child .avatar{ background:linear-gradient(135deg,var(--purple),var(--lilac)); }
  .lb-name{ font-family:'Outfit'; font-weight:400; color:#fff;
    font-size:clamp(10.6px, 3.741cqh, 24.5px); flex:1; }
  .lb li:first-child .lb-name{ font-weight:600; }
  .lb-val{ font-family:'Outfit'; font-weight:500; color:var(--ink2); font-size:clamp(9px,3.2cqh,20px); }

  /* ===== Componente: Lista territorial ===== */
  .rg-head{ display:flex; justify-content:space-between; flex-shrink:0; }
  .rg-head h3{ font-family:'Red Hat Display'; font-weight:700; color:#fff;
    font-size:clamp(12px,4.2cqh,26px); }
  .rg-head .src{ font-size:clamp(7px,2.2cqh,12px); color:var(--muted2); text-transform:uppercase; letter-spacing:.08em; align-self:flex-start; }
  .rg-list{ list-style:none; margin-top:.8em; flex:1; min-height:0; display:flex; flex-direction:column; gap:.5em; }
  .rg-list li{ display:flex; align-items:baseline; gap:.6em; font-size:clamp(10px,3.6cqh,22px); color:#fff; }
  .rg-list .rk{ color:var(--muted2); font-family:'Outfit'; font-weight:500; width:1.6em; flex-shrink:0; }
  .rg-list .rgname{ flex:1; }
  .rg-list .rgpct{ color:var(--lilac); font-weight:600; }
  .rg-stats{ flex-shrink:0; margin-top:.6em; }
  .rg-stats .v{ font-family:'Red Hat Display'; font-weight:800; color:#fff; font-size:clamp(14px,5.4cqh,32px); }
  .rg-stats .l{ font-size:clamp(7px,2.4cqh,13px); color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }

  .stale-flag{ position:fixed; bottom:10px; right:14px; font:11px/1 monospace; color:#553; opacity:.35; z-index:5; }
  .mock-badge{ position:absolute; top:8px; left:50%; transform:translateX(-50%);
    background:rgba(255,90,60,.15); border:1px solid rgba(255,120,90,.5); color:#FF8A6B;
    font-family:'Outfit'; font-weight:600; font-size:11px; letter-spacing:.16em;
    text-transform:uppercase; padding:4px 14px; border-radius:20px; z-index:10; display:none; }
</style>
</head>
<body>

<div class="wall" id="wall">

  <div class="mock-badge" id="mockBadge">dados de exemplo — não ao vivo</div>

  <!-- Linha 1 -->
  <div class="cell br bb" id="cell-hero-1">
    <div class="eyebrow" id="hero1-eyebrow">Total geral · —</div>
    <div class="hero-num">
      <div class="big" id="hero1-valor">R$ —</div>
      <div class="sub" id="hero1-meta">de R$ — de meta no mês</div>
      <div class="bar-track"><div class="bar-fill" id="hero1-bar" style="width:0%"></div></div>
      <div class="bar-pct" id="hero1-pct">—%</div>
    </div>
  </div>

  <div class="cell br bb id-cell">
    <div class="word">elements<span class="dot">.</span></div>
    <div class="slogan">viva sem medo</div>
  </div>

  <div class="cell bb" id="cell-hero-2">
    <div class="eyebrow">Projeção do mês</div>
    <div class="hero-num">
      <div class="big" id="hero2-valor">—%</div>
      <div class="sub" id="hero2-meta">fecha o mês nesse ritmo</div>
    </div>
  </div>

  <!-- Linha 2: evolução por canal -->
  <div class="cell br bb" id="canal-0"></div>
  <div class="cell br bb" id="canal-1"></div>
  <div class="cell bb" id="canal-2"></div>

  <!-- Linha 3: ranking + território -->
  <div class="cell br bb" id="cell-ranking"></div>
  <div class="cell br bb" id="cell-territorio"></div>
  <div class="cell bb"></div>

  <!-- Linha 4: reservada (espelha as 12 TVs físicas; sem conteúdo neste protótipo) -->
  <div class="cell br"></div>
  <div class="cell br"></div>
  <div class="cell"></div>

</div>

<div class="stale-flag" id="staleFlag"></div>

<script>
  var wall = document.getElementById('wall');

  /* ---- Canvas fixo + escala "cover" (regra validada, nunca trocar por contain) ---- */
  function fit(){
    var s = Math.max(window.innerWidth / 1920, window.innerHeight / 1080);
    wall.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  fit();
  window.addEventListener('resize', fit);

  var fmtBRL = new Intl.NumberFormat('pt-BR', { style:'currency', currency:'BRL', maximumFractionDigits:0 });
  var fmtNum = new Intl.NumberFormat('pt-BR');

  function svgChart(historico){
    var w = 100, h = 100, n = historico.length;
    var maxV = Math.max.apply(null, historico.map(function(d){ return Math.max(d.atingido, d.meta); }));
    var stepX = w / n;
    var bars = '', metaPts = '';
    historico.forEach(function(d, i){
      var bh = (d.atingido / maxV) * h;
      var mx = i * stepX + stepX/2;
      var my = h - (d.meta / maxV) * h;
      bars += '<rect x="'+(i*stepX + stepX*0.2)+'" y="'+(h-bh)+'" width="'+(stepX*0.6)+'" height="'+bh+'" rx="1" fill="#B47CFF" opacity="0.9"></rect>';
      metaPts += (metaPts?' L ':'M ') + mx + ' ' + my;
    });
    return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">' +
      bars +
      '<path d="'+metaPts+'" fill="none" stroke="#8A8A92" stroke-width="1" stroke-dasharray="2,2"></path>' +
      '</svg>';
  }

  function render(data){
    // Hero 1 — total geral
    document.getElementById('hero1-eyebrow').textContent = data.hero.titulo;
    document.getElementById('hero1-valor').textContent = fmtBRL.format(data.hero.valor);
    document.getElementById('hero1-meta').textContent = 'de ' + fmtBRL.format(data.hero.meta) + ' de meta no mês';
    document.getElementById('hero1-bar').style.width = Math.min(data.hero.pct_atingido, 100) + '%';
    document.getElementById('hero1-pct').textContent = data.hero.pct_atingido.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';

    // Hero 2 — projeção
    document.getElementById('hero2-valor').textContent =
      data.hero.projecao_pct.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%';
    if (data.hero.projecao) {
      document.getElementById('hero2-meta').textContent =
        'fecha o mês em ' + fmtBRL.format(data.hero.projecao);
    }

    // Aviso de dados congelados (mock) — removido quando o SharePoint estiver plugado
    document.getElementById('mockBadge').style.display = data.__aviso ? 'block' : 'none';

    // Canais (linha 2)
    data.canais.forEach(function(c, i){
      var el = document.getElementById('canal-' + i);
      if(!el) return;
      el.innerHTML =
        '<div class="canal-stat">' +
          '<h3>' + c.nome + '</h3>' +
          '<div class="val">' + fmtBRL.format(c.realizado) + '</div>' +
          '<div class="meta-txt">/ ' + fmtBRL.format(c.meta) + ' meta do mês</div>' +
          '<div class="pct-big">' + c.pct_meta.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%</div>' +
          '<div class="pct-lab">DA META DO MÊS</div>' +
        '</div>' +
        '<div class="chart">' + svgChart(c.historico) + '</div>';
    });

    // Ranking de vendedores (linha 3, col 1)
    var rk = data.ranking_vendedores;
    var rankHtml =
      '<div class="rank-head">' +
        '<h3>' + rk.titulo + '</h3>' +
        '<div class="cli-mini"><div class="num">' + rk.clientes_novos.valor + ' / ' + rk.clientes_novos.total + '</div>' +
        '<div class="lab">Novos</div></div>' +
      '</div>' +
      '<ul class="lb">';
    var topVal = rk.lista[0] ? rk.lista[0].valor : 1;
    rk.lista.forEach(function(p){
      var initials = p.nome.slice(0,2).toUpperCase();
      rankHtml += '<li><div class="avatar">' + initials + '</div>' +
        '<div class="lb-name">' + p.nome + '</div>' +
        '<div class="lb-val">' + fmtBRL.format(p.valor) + '</div></li>';
    });
    rankHtml += '</ul>';
    document.getElementById('cell-ranking').innerHTML = rankHtml;

    // Território (linha 3, col 2)
    var tr = data.territorio;
    var trHtml =
      '<div class="rg-head"><h3>' + tr.titulo + '</h3><div class="src">' + tr.fonte + '</div></div>' +
      '<ul class="rg-list">';
    tr.lista.forEach(function(l){
      trHtml += '<li><span class="rk">' + String(l.rank).padStart(2,'0') + '</span>' +
        '<span class="rgname">' + l.nome + '</span>' +
        '<span class="rgpct">' + l.pct.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1}) + '%</span></li>';
    });
    trHtml += '</ul>' +
      '<div class="rg-stats"><div class="v">' + fmtNum.format(tr.rodape.valor) + '</div>' +
      '<div class="l">' + tr.rodape.rotulo + '</div></div>';
    document.getElementById('cell-territorio').innerHTML = trHtml;

    document.getElementById('staleFlag').textContent = 'atualizado ' + new Date(data.atualizado_em).toLocaleTimeString('pt-BR');
  }

  function loadData(){
    fetch('/.netlify/functions/painel-data', { cache: 'no-store' })
      .then(function(r){ return r.json(); })
      .then(render)
      .catch(function(err){ console.error('Falha ao buscar dados do painel', err); });
  }

  loadData();
  /* Rebusca os dados sem precisar recarregar a página inteira */
  setInterval(loadData, 60 * 1000);

  /* Rede de segurança: recarrega a página a cada 5 min (cache-busting),
     garante que qualquer novo deploy de design tambem seja pego pela TV */
  setTimeout(function(){
    window.location.href = window.location.pathname + '?_r=' + Date.now();
  }, 5 * 60 * 1000);
</script>

</body>
</html>
